name: OCI ARM Catcher

on:
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: oci-arm-catcher
  cancel-in-progress: false

jobs:
  try-create:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install --retries 5 --timeout 60 oci-cli

      - name: Configure OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Skip if instance already running
        id: check
        run: |
          existing=$(oci compute instance list \
            --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
            --display-name "${{ vars.OCI_DISPLAY_NAME }}" \
            --lifecycle-state RUNNING \
            --query "data[0].id" --raw-output 2>/dev/null || true)
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ -n "$existing" ]; then
            echo "Instance already running: $existing -- nothing to do."
          fi

      - name: Attempt instance launch
        id: launch
        if: steps.check.outputs.existing == ''
        run: |
          printf '%s' "${{ secrets.OCI_SSH_PUBLIC_KEY }}" | tr -d '\r\n' > /tmp/ssh_key.pub
          echo "--- ssh key file (masked by GitHub, sanity-check length/lines only) ---"
          wc -l /tmp/ssh_key.pub
          wc -c /tmp/ssh_key.pub
          oci compute instance launch \
            --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
            --availability-domain "${{ vars.OCI_AVAILABILITY_DOMAIN }}" \
            --shape "${{ vars.OCI_SHAPE }}" \
            --shape-config "{\"ocpus\": ${{ vars.OCI_OCPUS }}, \"memoryInGBs\": ${{ vars.OCI_MEMORY_IN_GBS }}}" \
            --subnet-id "${{ vars.OCI_SUBNET_ID }}" \
            --image-id "${{ vars.OCI_IMAGE_ID }}" \
            --display-name "${{ vars.OCI_DISPLAY_NAME }}" \
            --assign-public-ip true \
            --ssh-authorized-keys-file /tmp/ssh_key.pub \
            --boot-volume-size-in-gbs "${{ vars.OCI_BOOT_VOLUME_GBS }}"

      # GitHub's native `schedule:` cron trigger is unreliable (can silently
      # not fire for long stretches), so we don't use it at all -- this job
      # re-triggers itself instead. `always()` overrides the default skip-after-
      # failure. The condition is "launch didn't succeed" (not "launch failed")
      # so a failure in ANY earlier step (e.g. pip timeout) can't end the chain.
      - name: Reschedule next attempt
        if: always() && steps.check.outputs.existing == '' && steps.launch.outcome != 'success'
        run: |
          sleep 60
          curl -sf --retry 5 --retry-delay 10 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/retry.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
